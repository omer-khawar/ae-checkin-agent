# EXAMPLE ONLY. Not listed in kustomization.yaml, so Argo CD never applies it, and it holds no real
# values. Create the real Secret out of band (or with Sealed Secrets, External Secrets or Vault):
#
#   kubectl -n interim create secret generic interim-secrets \
#     --from-literal=AUTH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DEMO_PASSWORD="<choose one>" \
#     --from-literal=BRIDGE_TOKEN="$(openssl rand -hex 16)"
apiVersion: v1
kind: Secret
metadata:
  name: interim-secrets
  namespace: interim
type: Opaque
stringData:
  AUTH_SECRET: "<random, 32 bytes or more>"
  DEMO_PASSWORD: "<demo password>"
  BRIDGE_TOKEN: "<shared token for the kiosk-laptop bridge>"
  # DATABASE_URL: "postgresql+psycopg://interim:<password>@postgres:5432/interim"
