# nginx config for the Interim web image (used by the Docker wave).
#
# - Serves the static Vite build from /usr/share/nginx/html with SPA history
#   fallback, so deep links like /dashboard/checkins/<id> load index.html.
# - Proxies /api/ to the FastAPI container (service name `api` in compose) so the
#   browser only ever sees a same-origin /api/v1 base (CONTRACTS.md §4).
# - The vitals bridge is NOT proxied: it runs on the kiosk machine and the web app
#   connects to it directly over WebSocket (VITE_BRIDGE_WS_URL or ws://<host>:8787).
#
# Expected Dockerfile usage:
#   COPY apps/web/nginx.conf /etc/nginx/conf.d/default.conf
#   COPY --from=build /app/apps/web/dist /usr/share/nginx/html

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable defaults for a demo deployment. No third-party scripts are loaded,
    # so a strict CSP is possible later; left permissive on inline styles for Tailwind.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API: strip nothing, forward /api/... to the api service's /api/... prefix.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Exports (bundle.zip) can be a few MB; do not buffer them to disk.
        proxy_buffering off;
    }

    # Hashed Vite assets are immutable; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback for React Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
