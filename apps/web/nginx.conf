# nginx config TEMPLATE for the Interim web image. apps/web/Dockerfile copies it to
# /etc/nginx/templates/default.conf.template; the stock nginx entrypoint renders it to
# conf.d/default.conf at container start, substituting only the API_UPSTREAM and
# NGINX_LOCAL_RESOLVERS placeholders (envsubst touches only variables that exist in the
# environment, so nginx's own lower-case variables such as host and uri are left alone).
#
# - Serves the static Vite build from /usr/share/nginx/html with SPA history fallback, so deep
#   links like /dashboard/checkins/<id> load index.html.
# - Proxies /api/ to the FastAPI service (API_UPSTREAM, default http://api:8000 = the compose
#   service) so the browser only ever sees a same-origin /api/v1 base (CONTRACTS.md §4).
#   The upstream is a VARIABLE, so nginx resolves it per request through `resolver` (Docker's
#   embedded DNS in compose, the cluster DNS in Kubernetes; NGINX_ENTRYPOINT_LOCAL_RESOLVERS makes
#   the entrypoint read it from /etc/resolv.conf). Consequences: the image starts (and `nginx -t`
#   passes) with no `api` host present, /api answers 502 until the API is reachable, and a
#   recreated api container on a new IP is picked up within `valid=` seconds without restarting
#   web. nginx's resolver does not apply resolv.conf search domains: outside compose set
#   API_UPSTREAM to a fully qualified name (e.g. http://api.interim.svc.cluster.local:8000).
# - The vitals bridge is NOT proxied: it runs on the kiosk machine and the web app connects to it
#   directly over WebSocket (VITE_BRIDGE_WS_URL at build time, else ws://<page hostname>:8787).
# - IPv4 listener only: `listen [::]:80` fails on hosts booted with IPv6 disabled, and the stock
#   image's IPv6 helper leaves custom configs alone.
#
# nginx only inherits `add_header` from the server block into a location that sets none of its
# own, so the security headers are repeated in every location that adds a header.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Mock-EDC posts and draft edits are small; exports are downloads, not uploads.
    client_max_body_size 5m;

    # No third-party scripts are loaded (CLAUDE.md §13), so a strict CSP is possible later; it is
    # left out for now because the kiosk opens ws://<host>:8787 to the bridge on another port.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css text/csv application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Per-request DNS for the API upstream (see header). ipv6=off: compose networks are IPv4.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout 5s;

    # API: forward /api/... unchanged. With a variable and no URI part, proxy_pass sends the
    # original request URI as-is.
    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used (localhost:5173), so absolute URLs the API
        # builds (e.g. FastAPI's trailing-slash 307 Location) point back at this origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Exports (bundle.zip) can be a few MB; stream them instead of buffering to disk.
        proxy_buffering off;
    }

    # Hashed Vite assets are immutable; cache them for a year. No `always` here: nginx then adds
    # the header only to 2xx/3xx responses, so a 404 for a stale chunk name is never cached.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # SPA history fallback for React Router. index.html is never cached so a redeploy is picked
    # up on the next load.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
